<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SVG — основний: масштабується без втрат і важить найменше.
         PNG 32×32 для браузерів, які SVG-іконку не беруть.
         apple-touch-icon — для «на головний екран» на iOS. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Сервіс лояльності — панель адміністратора</title>
  </head>
