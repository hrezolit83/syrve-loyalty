# Панель адміністратора + проксі на API.
#
# Навіщо проксі: JWT лежить у httpOnly cookie. Коли сторінка й API на одному
# origin (http://localhost:8080 і http://localhost:8080/api), браузер надсилає
# cookie без жодних дозволів CORS і без SameSite=None. У режимі розробки
# цю саму роль грає proxy у vite.config.ts.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip на статику — зібраний бандл стискається приблизно втричі.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Без цього заголовка API бачив би адресу контейнера nginx,
    # і лімітер входу вважав би всі спроби однією.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Хеші у назвах файлів — кешувати можна назавжди.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: будь-який інший шлях віддаємо index.html, маршрутизацію
  # робить react-router уже в браузері.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
